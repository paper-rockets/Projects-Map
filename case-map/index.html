<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Case Map</title>
<meta name="description" content="Link analysis map for alleged fraud and scam victims: people, accounts, transactions, notes and open questions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#f3f5f8; --canvas:#eef1f5; --surface:#ffffff; --surface-2:#f7f8fb; --sunken:#e8ecf2;
  --line:#d9dfe8; --line-strong:#c3ccd8; --grid:#d5dbe4;
  --ink:#172235; --ink-2:#3d4a60; --muted:#667389; --faint:#8d98aa;
  --accent:#0f6e76; --accent-ink:#ffffff; --accent-soft:#dff0f1;
  --victim:#2863c7; --victim-soft:#e4edfb;
  --fraud:#c0392f; --fraud-soft:#fbe8e6;
  --account:#55657d; --account-soft:#eaeef3;
  --money:#17845a; --money-soft:#e1f3ea;
  --question:#b27806; --question-soft:#fcf1d9;
  --note:#6a57a6; --note-soft:#eeeaf8;
  --shared:#a23d8c;
  --shadow:0 1px 2px rgba(23,34,53,.06),0 4px 14px rgba(23,34,53,.07);
  --shadow-lg:0 18px 50px rgba(23,34,53,.18);
  --r:10px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10151d; --canvas:#0d1219; --surface:#18202b; --surface-2:#1c2531; --sunken:#121922;
    --line:#2a3544; --line-strong:#3a4758; --grid:#243040;
    --ink:#e8edf4; --ink-2:#c3ccd9; --muted:#8e9bb0; --faint:#6b778a;
    --accent:#3fb3bc; --accent-ink:#06181a; --accent-soft:#16333a;
    --victim:#6ea0f5; --victim-soft:#1a2a45;
    --fraud:#f0776c; --fraud-soft:#3a1d1c;
    --account:#9aa9bf; --account-soft:#222c3a;
    --money:#4cc590; --money-soft:#133126;
    --question:#e9b243; --question-soft:#382c12;
    --note:#a996e6; --note-soft:#2a2442;
    --shared:#e27ccb;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    --shadow-lg:0 18px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10151d; --canvas:#0d1219; --surface:#18202b; --surface-2:#1c2531; --sunken:#121922;
  --line:#2a3544; --line-strong:#3a4758; --grid:#243040;
  --ink:#e8edf4; --ink-2:#c3ccd9; --muted:#8e9bb0; --faint:#6b778a;
  --accent:#3fb3bc; --accent-ink:#06181a; --accent-soft:#16333a;
  --victim:#6ea0f5; --victim-soft:#1a2a45;
  --fraud:#f0776c; --fraud-soft:#3a1d1c;
  --account:#9aa9bf; --account-soft:#222c3a;
  --money:#4cc590; --money-soft:#133126;
  --question:#e9b243; --question-soft:#382c12;
  --note:#a996e6; --note-soft:#2a2442;
  --shared:#e27ccb;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 18px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- App frame ---------- */
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:320px 1fr 340px;grid-template-areas:"top top top" "left main right"}
.topbar{grid-area:top;display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.case-id{display:flex;flex-direction:column;min-width:0;flex:1 1 280px;max-width:460px}
.case-eyebrow{font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.case-title{font-size:17px;font-weight:700;letter-spacing:-.01em;border:0;background:transparent;padding:2px 0 0;min-width:0;width:100%;outline:0;text-overflow:ellipsis}
.case-title:focus{box-shadow:0 1px 0 var(--accent)}
.kpis{display:flex;gap:2px;margin-left:auto;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.kpi{display:flex;flex-direction:column;align-items:flex-start;padding:4px 12px;border-left:1px solid var(--line);white-space:nowrap}
.kpi b{font:600 16px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi.loss b{color:var(--fraud)}
.kpi.q b{color:var(--question)}
.top-actions{display:flex;gap:6px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--line-strong);color:var(--ink);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.small{min-height:26px;padding:0 9px;font-size:11.5px}
.btn.danger{color:var(--fraud)}
.btn.danger.armed{background:var(--fraud);border-color:var(--fraud);color:#fff}
.btn svg,.icon-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}

/* ---------- Side panels ---------- */
.panel{background:var(--surface);display:flex;flex-direction:column;min-height:0;min-width:0}
.panel.left{grid-area:left;border-right:1px solid var(--line)}
.panel.right{grid-area:right;border-left:1px solid var(--line)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px}
.panel-head h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel-scroll{overflow-y:auto;flex:1;min-height:0;padding:0 12px 16px}
.privacy{margin:0 16px 10px;padding:8px 10px;border-radius:8px;background:var(--sunken);color:var(--muted);font-size:11.5px;display:flex;gap:8px;align-items:flex-start}
.privacy svg{width:14px;height:14px;flex:none;margin-top:2px;fill:none;stroke:currentColor;stroke-width:2}

.section{border-top:1px solid var(--line);padding:10px 4px 8px}
.section:first-child{border-top:0}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.section-head h3{margin:0;font-size:13px;font-weight:650;flex:1;display:flex;align-items:center;gap:8px}
.count{font:600 11px/1 var(--mono);color:var(--muted);background:var(--sunken);border-radius:10px;padding:3px 7px}
.dot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--c,var(--account))}
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;border:1px solid transparent;background:transparent;text-align:left;width:100%}
.row:hover{background:var(--surface-2);border-color:var(--line)}
.row.active{background:var(--accent-soft);border-color:transparent}
.row-main{min-width:0}
.row-title{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{font:500 11.5px var(--mono);color:var(--ink-2);text-align:right;white-space:nowrap}
.row-end.money{color:var(--money)}
.empty-row{font-size:12px;color:var(--faint);padding:4px 8px 6px}
.status-pill{font:600 10px/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;border-radius:5px}
.status-open{background:var(--question-soft);color:var(--question)}
.status-answered{background:var(--money-soft);color:var(--money)}

/* ---------- Main / map ---------- */
.main{grid-area:main;position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--canvas)}
.mapbar{position:absolute;z-index:5;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;flex-wrap:wrap}
.mapbar>*{pointer-events:auto}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--surface)}
.layers{display:flex;gap:4px;padding:4px;border-radius:9px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);flex-wrap:wrap}
.layer{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:6px;background:transparent;padding:4px 8px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.layer i{width:16px;height:0;border-top:2.5px solid var(--c);display:inline-block}
.layer i.dash{border-top-style:dashed}
.layer i.dot{border-top-style:dotted;border-top-width:3px}
.layer[aria-pressed="false"]{color:var(--faint)}
.layer[aria-pressed="false"] i{opacity:.3}
.layer:hover{background:var(--sunken)}
.mapzoom{position:absolute;z-index:5;right:12px;bottom:12px;display:flex;flex-direction:column;gap:2px;padding:3px;border-radius:9px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.legend{position:absolute;z-index:5;left:12px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;padding:7px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:11.5px;color:var(--ink-2);max-width:calc(100% - 80px)}
.legend span{display:inline-flex;align-items:center;gap:6px}

.viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;background-image:radial-gradient(circle,var(--grid) 1px,transparent 1.3px);background-size:24px 24px}
.viewport.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke-width:2;transition:opacity .15s}
.edge.money{stroke:var(--money);stroke-width:2.4}
.edge.owns{stroke:var(--account);stroke-width:1.5;opacity:.7}
.edge.shared{stroke:var(--shared);stroke-dasharray:6 5;stroke-width:2}
.edge.mention{stroke:var(--note);stroke-dasharray:2 5;stroke-width:1.6;stroke-linecap:round;opacity:.55}
.edge.mention.q{stroke:var(--question)}
.edge-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.labels{position:absolute;left:0;top:0}
.elabel{position:absolute;transform:translate(-50%,-50%);padding:2px 7px;border-radius:6px;font:600 12px/1.3 var(--mono);white-space:nowrap;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);box-shadow:0 1px 3px rgba(0,0,0,.08);transition:opacity .15s;pointer-events:none;text-align:center}
.elabel.money{color:var(--money);border-color:color-mix(in srgb,var(--money) 40%,var(--line))}
.elabel.money small{display:block;font:500 10px/1.2 var(--sans);color:var(--muted)}
.elabel.shared{color:var(--shared);border-color:color-mix(in srgb,var(--shared) 40%,var(--line));font-family:var(--sans);font-size:10.5px}
.arrowhead{fill:var(--money)}

.node{position:absolute;width:210px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;user-select:none;touch-action:none;transition:opacity .15s,box-shadow .15s,border-color .15s}
.node:hover{border-color:var(--line-strong)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent),var(--shadow)}
.node-top{display:flex;align-items:center;gap:6px;padding:8px 10px 0}
.tag{font:700 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--soft);color:var(--c)}
.node-flags{margin-left:auto;display:flex;gap:4px}
.flag{font:600 10px/1 var(--mono);padding:3px 5px;border-radius:4px}
.flag.q{background:var(--question-soft);color:var(--question)}
.flag.n{background:var(--note-soft);color:var(--note)}
.flag.hot{background:var(--fraud-soft);color:var(--fraud)}
.node-body{padding:5px 10px 9px}
.node-title{font-size:15px;font-weight:650;line-height:1.25;overflow-wrap:anywhere}
.node-sub{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.node-num{font:500 13px var(--mono);color:var(--ink-2);margin-top:3px}
.node-foot{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-top:1px solid var(--line);font:500 12px var(--mono);color:var(--muted)}
.node-foot .in{color:var(--money)}
.node-foot .out{color:var(--fraud)}
.node.k-victim{--c:var(--victim);--soft:var(--victim-soft);border-left:3px solid var(--victim)}
.node.k-suspect{--c:var(--fraud);--soft:var(--fraud-soft);border-left:3px solid var(--fraud)}
.node.k-other{--c:var(--ink-2);--soft:var(--sunken);border-left:3px solid var(--ink-2)}
.node.k-account{--c:var(--account);--soft:var(--account-soft)}
.node.k-note{--c:var(--note);--soft:var(--note-soft);width:230px;background:var(--surface-2)}
.node.k-question{--c:var(--question);--soft:var(--question-soft);width:230px;background:var(--surface-2);border-style:dashed;border-color:color-mix(in srgb,var(--question) 55%,var(--line))}
.node.k-question.answered{border-style:solid;border-color:var(--line)}
.node.k-note .node-title,.node.k-question .node-title{font-size:13px;font-weight:500;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.node.k-account.unknown{border-style:dashed}
.lane-label{position:absolute;font:700 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.lane-rule{position:absolute;height:0;border-top:1px dashed var(--line-strong)}
.dim .node:not(.hl),.dim .elabel:not(.hl){opacity:.18}
.dim .edge:not(.hl){opacity:.07}
.map-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);pointer-events:none;padding:24px}
.map-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* ---------- Timeline view ---------- */
.timeline{position:absolute;inset:0;overflow-y:auto;padding:64px 24px 32px}
.tl-inner{max-width:860px;margin:0 auto}
.tl-month{font:700 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.tl-month::after{content:"";flex:1;border-top:1px solid var(--line)}
.tl-item{display:grid;grid-template-columns:92px 14px 1fr auto;gap:12px;align-items:start;padding:10px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line);margin-bottom:6px}
.tl-date{font:500 12px var(--mono);color:var(--ink-2);padding-top:1px}
.tl-mark{width:10px;height:10px;border-radius:50%;margin-top:4px;background:var(--c)}
.tl-what{font-size:13px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.tl-what small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.tl-amt{font:600 13px var(--mono);color:var(--money);text-align:right;white-space:nowrap}
.tl-amt small{display:block;font:500 10.5px var(--sans);color:var(--muted)}

/* ---------- Right panel: findings ---------- */
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:10px 10px 9px;font-size:12.5px;font-weight:650;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.finding{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:10px 12px 10px 14px;margin-top:8px;position:relative;overflow:hidden}
.finding::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sev)}
.finding:hover{border-color:var(--line-strong);background:var(--surface-2)}
.finding.on{border-color:var(--accent);background:var(--accent-soft)}
.finding.high{--sev:var(--fraud)}
.finding.med{--sev:var(--question)}
.finding.info{--sev:var(--account)}
.f-head{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.sev{font:700 9.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--sev)}
.f-kind{font-size:10.5px;color:var(--faint);margin-left:auto;font-weight:600}
.f-title{font-size:13px;font-weight:650;line-height:1.3}
.f-text{font-size:12px;color:var(--ink-2);margin-top:3px}
.f-text .mono{font-size:11.5px}
.sub-h{font:700 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 4px 2px;display:flex;align-items:center;gap:8px}
.q-card{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:10px 12px;margin-top:8px}
.q-card.suggested{border-style:dashed;background:var(--surface-2)}
.q-text{font-size:13px;font-weight:550;line-height:1.35}
.q-meta{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.q-answer{font-size:12px;color:var(--ink-2);margin-top:6px;padding:6px 8px;border-radius:6px;background:var(--money-soft)}
.q-add{display:flex;gap:6px;margin-top:8px}
.q-add textarea{flex:1;min-height:38px;resize:vertical}
.detail-card{padding:4px 4px 0}
.detail-card h3{margin:6px 0 2px;font-size:16px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:12.5px;margin:10px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.conn{display:flex;gap:8px;align-items:flex-start;padding:7px 4px;border-top:1px solid var(--line);font-size:12.5px}
.conn i{width:16px;margin-top:8px;border-top:2.5px solid var(--c);flex:none}
.conn i.dash{border-top-style:dashed}
.conn i.dot{border-top-style:dotted;border-top-width:3px}
.conn small{display:block;color:var(--muted);font-size:11.5px}
.conn button{border:0;background:none;padding:0;font-weight:650;color:var(--ink);text-align:left}
.conn button:hover{color:var(--accent);text-decoration:underline}
.muted{color:var(--muted)}

/* ---------- Dialog / forms ---------- */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lg);width:min(520px,calc(100vw - 32px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(12,18,28,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
.dlg-head h2{margin:0;font-size:16px;flex:1}
.dlg-body{padding:6px 18px 8px;overflow-y:auto}
.dlg-foot{display:flex;gap:8px;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line)}
.dlg-foot .spacer{flex:1}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.field label{font-size:11.5px;font-weight:650;color:var(--ink-2)}
.field .hint{font-size:11px;color:var(--faint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.input,select.input,textarea.input{width:100%;min-height:36px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13px;outline:0}
textarea.input{min-height:72px;resize:vertical;line-height:1.45}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.input.mono{font-family:var(--mono)}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.choice button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.paste-preview{margin-top:10px;overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-height:200px}
.paste-preview table{border-collapse:collapse;width:100%;font-size:11.5px}
.paste-preview th,.paste-preview td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.paste-preview th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.menu{position:absolute;z-index:30;min-width:220px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow-lg)}
.menu button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;border-radius:6px;padding:8px 10px;font-size:12.5px;text-align:left;color:var(--ink)}
.menu button:hover{background:var(--sunken)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 2px}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);opacity:0;padding:9px 14px;border-radius:9px;background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:600;transition:opacity .15s,transform .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mobile-tabs{display:none}
.app.focus{grid-template-columns:0 1fr 0}
.app.focus .panel{visibility:hidden;border:0}
.map-right{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .app{grid-template-columns:290px 1fr 310px}
  .kpi.hide-md{display:none}
}
@media (max-width:920px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"top" "main" "tabs"}
  .panel.left,.panel.right{position:fixed;z-index:20;top:0;bottom:0;width:min(380px,92vw);box-shadow:var(--shadow-lg);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px)}
  .panel.left{left:0;transform:translateX(-102%)}
  .panel.right{right:0;transform:translateX(102%)}
  .panel.open{transform:none}
  .scrim{position:fixed;inset:0;z-index:15;background:rgba(12,18,28,.4)}
  .mobile-tabs{grid-area:tabs;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
  .mobile-tabs .btn{flex:1;justify-content:center}
  .kpis{display:none}
  .top-actions .hide-sm{display:none}
  .legend{display:none}
  .layers{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
  .layer{white-space:nowrap}
  #btn-focus{display:none}
  .map-right{flex-wrap:nowrap;max-width:100%}
  .panel .close-drawer{display:inline-grid!important}
}
@media (min-width:921px){.scrim{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(() => {
'use strict';
const STORE = 'case-map-v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const norm = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
const normName = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const digits = s => String(s ?? '').replace(/\D/g, '');

function parseAmount(v) {
  if (typeof v === 'number') return v;
  let s = String(v ?? '').trim().toLowerCase().replace(/,/g, '');
  let mult = 1;
  if (/\dk\b/.test(s)) mult = 1e3;
  if (/\dm\b/.test(s)) mult = 1e6;
  const m = s.match(/-?\d+(\.\d+)?/);
  return m ? Math.round(parseFloat(m[0]) * mult * 100) / 100 : 0;
}
function parseDate(v) {
  const s = String(v ?? '').trim();
  if (!s) return '';
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/); // day first (UK / EU style)
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  const d = new Date(s);
  return isNaN(d) ? '' : d.toISOString().slice(0, 10);
}
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso, withYear = true) {
  if (!iso) return 'No date';
  const [y, m, d] = iso.split('-').map(Number);
  return `${d} ${MONTHS[m - 1]}${withYear ? ' ' + y : ''}`;
}
const dayDiff = (a, b) => (Date.parse(b) - Date.parse(a)) / 864e5;
function money(n, compact = false) {
  const cur = state?.meta?.currency || 'GBP';
  try {
    return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur, maximumFractionDigits: compact && Math.abs(n) >= 1e4 ? 0 : (n % 1 ? 2 : 0), notation: compact && Math.abs(n) >= 1e6 ? 'compact' : 'standard' }).format(n);
  } catch (_) { return cur + ' ' + n.toLocaleString(); }
}
function maskNum(num) {
  const s = String(num ?? '').trim();
  if (!s) return '';
  const d = s.replace(/\s/g, '');
  return d.length > 8 ? '•• ' + d.slice(-4) : s;
}

const ROLE = { victim: 'Victim', suspect: 'Alleged fraudster', other: 'Other party' };
const ACC_TYPE = { bank: 'Bank account', business: 'Business account', card: 'Card', payment: 'Payment app / e-money', crypto: 'Crypto wallet', other: 'Other' };

function exampleCase() {
  return {
    meta: { title: 'Veltrix Capital investment scam', ref: 'CASE-2026-0147', currency: 'GBP', analyst: '' },
    people: [
      { id: 'p1', role: 'victim', name: 'Margaret Holloway', aliases: '', phone: '07700 900412', email: '', notes: 'Met “David” on a dating app in Nov 2025. Persuaded to invest in a crypto trading platform called Veltrix Capital.' },
      { id: 'p2', role: 'victim', name: 'Daniel Osei', aliases: '', phone: '', email: 'd.osei@example.com', notes: 'Cold-called by a Veltrix Capital “account manager”. Calls came from +44 7700 900981.' },
      { id: 'p3', role: 'victim', name: 'Priya Nair', aliases: '', phone: '', email: '', notes: 'Answered an Instagram advert for Veltrix Capital. Adviser messaged her on WhatsApp from +44 7700 900981.' },
      { id: 's1', role: 'suspect', name: 'David Mercer', aliases: 'Dave M, D. Mercer', phone: '+44 7700 900981', email: 'd.mercer@veltrix-capital.example', notes: 'Name used on the dating profile and as the Veltrix “account manager”. Probably a false identity.' },
      { id: 's2', role: 'suspect', name: 'Kestrel Trading Ltd', aliases: 'Kestrel Trading', phone: '', email: '', notes: 'Named on the invoices sent to victims. Incorporated three months before the first payment.' },
      { id: 'o1', role: 'other', name: 'Jamal Price', aliases: 'J Price', phone: '', email: '', notes: 'Account holder at Monzo. Student, 19. Possible money mule.' }
    ],
    accounts: [
      { id: 'a1', holder: 'Margaret Holloway', institution: 'Barclays', number: '20-45-77 43891022', type: 'bank', notes: '' },
      { id: 'a2', holder: 'Daniel Osei', institution: 'HSBC', number: '40-11-62 71550934', type: 'bank', notes: '' },
      { id: 'a3', holder: 'Priya Nair', institution: 'Nationwide', number: '07-01-16 22190456', type: 'bank', notes: '' },
      { id: 'a4', holder: 'Kestrel Trading Ltd', institution: 'Metro Bank', number: '23-05-80 60447123', type: 'business', notes: 'Opened Sept 2025.' },
      { id: 'a5', holder: 'Jamal Price', institution: 'Monzo', number: '04-00-04 11873360', type: 'bank', notes: '' },
      { id: 'a6', holder: '', institution: 'Revolut', number: 'GB29 REVO 0099 6912 3456 78', type: 'payment', notes: 'Holder not yet confirmed.' },
      { id: 'a7', holder: '', institution: 'Bitcoin wallet', number: 'bc1q9h7k3xy2lm4tq8f0w6ze', type: 'crypto', notes: 'Wallet address sent by David Mercer over WhatsApp.' }
    ],
    transactions: [
      { id: 't1', date: '2025-11-28', from: 'a1', to: 'a4', amount: 4500, method: 'Faster Payment', reference: 'VELTRIX INV 0192', notes: 'First “investment”.' },
      { id: 't2', date: '2025-12-12', from: 'a1', to: 'a4', amount: 18000, method: 'CHAPS', reference: 'VELTRIX TOPUP', notes: '' },
      { id: 't3', date: '2025-12-14', from: 'a4', to: 'a5', amount: 17500, method: 'Faster Payment', reference: 'CONSULTANCY', notes: '' },
      { id: 't4', date: '2026-01-06', from: 'a2', to: 'a5', amount: 9800, method: 'Faster Payment', reference: 'DEPOSIT VX', notes: '' },
      { id: 't5', date: '2026-01-07', from: 'a5', to: 'a6', amount: 26900, method: 'Faster Payment', reference: 'JP', notes: '' },
      { id: 't6', date: '2026-01-20', from: 'a3', to: 'a4', amount: 12250, method: 'Faster Payment', reference: 'VELTRIX 3381', notes: '' },
      { id: 't7', date: '2026-01-21', from: 'a4', to: 'a6', amount: 12000, method: 'Faster Payment', reference: 'INVOICE 55', notes: '' },
      { id: 't8', date: '2026-01-22', from: 'a6', to: 'a7', amount: 38400, method: 'Crypto purchase', reference: 'BTC', notes: 'Converted and sent to wallet.' },
      { id: 't9', date: '2026-02-03', from: 'a1', to: 'a5', amount: 6000, method: 'Faster Payment', reference: 'WITHDRAWAL FEE', notes: 'Asked to pay a fee to release “profits”.' }
    ],
    notes: [
      { id: 'n1', date: '2026-01-09', text: 'Monzo gave a partial Confirmation of Payee match on the account ending 3360. Name returned: “J Price”.' },
      { id: 'n2', date: '2026-02-05', text: 'Margaret Holloway was told to pay a £6,000 “withdrawal fee” before profits could be released. David Mercer pressed her by phone. Typical advance-fee pattern.' },
      { id: 'n3', date: '2026-02-10', text: 'The number +44 7700 900981 appears in both victim statements from Daniel Osei and Priya Nair.' }
    ],
    questions: [
      { id: 'q1', text: 'Who controls the Revolut account GB29 REVO 0099 6912 3456 78?', status: 'open', answer: '' },
      { id: 'q2', text: 'Is Jamal Price a knowing participant, or was he recruited as a money mule?', status: 'open', answer: '' },
      { id: 'q3', text: 'Did Kestrel Trading Ltd ever trade, or is it a front company?', status: 'answered', answer: 'Companies House: no filed accounts, one dormant director. Treat as a front company.' }
    ],
    pos: {}
  };
}
function emptyCase() {
  return { meta: { title: 'Untitled case', ref: 'CASE-' + new Date().getFullYear() + '-' + String(Math.floor(Math.random() * 9000) + 1000), currency: 'GBP', analyst: '' }, people: [], accounts: [], transactions: [], notes: [], questions: [], pos: {} };
}
function sanitize(c) {
  const base = emptyCase();
  if (!c || typeof c !== 'object') return base;
  for (const k of ['people', 'accounts', 'transactions', 'notes', 'questions']) base[k] = Array.isArray(c[k]) ? c[k].filter(x => x && typeof x === 'object').map(x => ({ ...x, id: x.id || uid(k[0]) })) : [];
  base.meta = { ...base.meta, ...(c.meta || {}) };
  base.pos = c.pos && typeof c.pos === 'object' ? c.pos : {};
  base.transactions.forEach(t => { t.amount = parseAmount(t.amount); t.date = parseDate(t.date) || ''; });
  return base;
}

let state;
try { const raw = localStorage.getItem(STORE); state = raw ? sanitize(JSON.parse(raw)) : exampleCase(); } catch (_) { state = exampleCase(); }
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (_) {} }

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* =====================================================================
   Link analysis. Every link carries a plain-language reason (`why`),
   so the map never shows a connection without saying where it came from.
   ===================================================================== */
const byDate = (a, b) => (a.date || '9999').localeCompare(b.date || '9999');
function accLabel(a) { return a ? `${a.institution || ACC_TYPE[a.type] || 'Account'} ${maskNum(a.number)}`.trim() : 'Unknown account'; }

const RE_EMAIL = /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/gi;
const RE_PHONE = /(?:\+|\b0)\d[\d\s().-]{7,16}\d/g;
const RE_WALLET = /\b(bc1[a-z0-9]{14,}|[13][a-km-zA-HJ-NP-Z1-9]{25,34}|0x[a-fA-F0-9]{40}|T[1-9A-HJ-NP-Za-km-z]{33})\b/g;
const RE_LAST4 = /(?:ending(?:\s+in)?|ends\s+in|last\s+(?:4|four)(?:\s+digits)?|x{2,}|\*{2,}|•+|#)\s*:?\s*(\d{4})\b/gi;

function analyse() {
  const S = state;
  const people = S.people, accounts = S.accounts;
  const accById = new Map(accounts.map(a => [a.id, a]));
  const personById = new Map(people.map(p => [p.id, p]));
  const nodes = [], edges = [], findings = [], suggested = [];
  const nodeMap = new Map();
  const addNode = (id, kind, ref) => { const n = { id, kind, ref }; nodes.push(n); nodeMap.set(id, n); return n; };
  const addEdge = e => { e.id = 'e' + edges.length; edges.push(e); return e; };
  const nameOf = id => personById.get(id)?.name || accLabel(accById.get(id));

  people.forEach(p => addNode(p.id, ROLE[p.role] ? p.role : 'other', p));
  accounts.forEach(a => addNode(a.id, 'account', a));

  // ---- Name index (full names and aliases only, to avoid false matches)
  const nameIdx = new Map();
  people.forEach(p => [p.name, ...String(p.aliases || '').split(/[,;\n]/)].map(normName).filter(n => n.length >= 3)
    .forEach(n => { if (!nameIdx.has(n)) nameIdx.set(n, p); }));
  const findNames = text => { const t = ' ' + normName(text) + ' '; const out = new Set(); nameIdx.forEach((p, n) => { if (t.includes(' ' + n + ' ')) out.add(p.id); }); return out; };

  // ---- Ownership
  const ownerId = new Map();
  accounts.forEach(a => {
    const p = nameIdx.get(normName(a.holder));
    if (p) { ownerId.set(a.id, p.id); addEdge({ type: 'owns', from: p.id, to: a.id, why: `${p.name} is named as the holder of this account.` }); }
  });
  const roleOfAcc = id => personById.get(ownerId.get(id))?.role || (accById.get(id)?.holder ? 'named' : 'unknown');

  // ---- Money flows (payments between the same two accounts are combined)
  const txs = S.transactions.filter(t => accById.has(t.from) && accById.has(t.to) && t.from !== t.to).slice().sort(byDate);
  const inflow = new Map(), outflow = new Map(), edgeOfTx = new Map();
  const pairs = new Map();
  txs.forEach(t => {
    const k = t.from + '>' + t.to; if (!pairs.has(k)) pairs.set(k, []); pairs.get(k).push(t);
    inflow.set(t.to, (inflow.get(t.to) || 0) + t.amount);
    outflow.set(t.from, (outflow.get(t.from) || 0) + t.amount);
  });
  pairs.forEach(list => {
    const total = list.reduce((s, t) => s + t.amount, 0);
    const dated = list.filter(t => t.date);
    const sub = list.length > 1
      ? `${list.length} payments${dated.length ? ' · ' + fmtDate(dated[0].date, false) + ' – ' + fmtDate(dated[dated.length - 1].date, false) : ''}`
      : (list[0].date ? fmtDate(list[0].date) : 'No date');
    const e = addEdge({ type: 'money', from: list[0].from, to: list[0].to, total, txs: list, label: money(total, true), sub,
      why: `${list.length} recorded payment${list.length > 1 ? 's' : ''} totalling ${money(total)}.` });
    list.forEach(t => edgeOfTx.set(t.id, e));
  });

  // ---- Victim losses: money leaving a victim's own accounts to someone else
  const lossBy = new Map();
  txs.forEach(t => {
    const from = ownerId.get(t.from), to = ownerId.get(t.to);
    if (from && personById.get(from).role === 'victim' && from !== to) lossBy.set(from, (lossBy.get(from) || 0) + t.amount);
  });
  const totalLoss = [...lossBy.values()].reduce((a, b) => a + b, 0);

  // ---- Identifiers (phones, emails, wallets) and where each one appears
  const acctDigits = accounts.map(a => digits(a.number)).filter(d => d.length >= 6);
  function extract(text) {
    const out = [], s = String(text || '');
    (s.match(RE_EMAIL) || []).forEach(m => out.push({ key: 'e:' + m.toLowerCase(), label: m, type: 'email' }));
    (s.match(RE_PHONE) || []).forEach(m => {
      const d = digits(m);
      if (d.length < 10 || d.length > 13) return;
      if (acctDigits.some(a => a.includes(d) || d.includes(a))) return;
      out.push({ key: 'p:' + d.slice(-10), label: m.trim(), type: 'phone' });
    });
    (s.match(RE_WALLET) || []).forEach(m => out.push({ key: 'w:' + m.toLowerCase(), label: m, type: 'wallet' }));
    return out;
  }
  const ident = new Map();
  const note = (entity, it, owned) => {
    if (!ident.has(it.key)) ident.set(it.key, { ...it, src: new Map() });
    const rec = ident.get(it.key);
    if (owned || it.label.length > rec.label.length && !rec.ownedLabel) { rec.label = it.label; if (owned) rec.ownedLabel = true; }
    const prev = rec.src.get(entity);
    rec.src.set(entity, prev || owned);
  };
  people.forEach(p => {
    extract(p.phone).forEach(i => note(p.id, i, true));
    extract(p.email).forEach(i => note(p.id, i, true));
    extract(p.notes).forEach(i => note(p.id, i, false));
  });
  accounts.forEach(a => {
    if (a.type === 'crypto' && a.number) note(a.id, { key: 'w:' + String(a.number).trim().toLowerCase(), label: a.number, type: 'wallet' }, true);
    extract(a.notes).forEach(i => note(a.id, i, false));
  });
  const identOwners = key => { const r = ident.get(key); return r ? [...r.src].filter(([, o]) => o).map(([id]) => id) : []; };
  const TYPE_WORD = { phone: 'phone number', email: 'email address', wallet: 'wallet address' };

  ident.forEach(rec => {
    const ids = [...rec.src.keys()];
    if (ids.length < 2) return;
    const owners = ids.filter(id => rec.src.get(id));
    const hub = owners[0] || ids[0];
    const made = [];
    ids.forEach(id => {
      if (id === hub) return;
      made.push(addEdge({ type: 'shared', from: hub, to: id, label: 'Same ' + rec.type, sub: rec.label,
        why: `The ${TYPE_WORD[rec.type]} ${rec.label} appears in both records.` }));
    });
    const victims = ids.filter(id => personById.get(id)?.role === 'victim');
    const suspects = ids.filter(id => personById.get(id)?.role === 'suspect');
    findings.push({
      sev: victims.length >= 2 || (victims.length && suspects.length) ? 'high' : 'med', kind: 'Shared detail',
      title: `Same ${TYPE_WORD[rec.type]} in ${ids.length} records`,
      text: `<span class="mono">${esc(rec.label)}</span> appears for ${ids.map(id => '<b>' + esc(nameOf(id)) + '</b>').join(', ')}.` +
        (victims.length >= 2 ? ' Separate victims were contacted the same way, which points to the same operation.' : ''),
      nodes: ids, edges: made.map(e => e.id)
    });
  });

  // ---- Names mentioned inside other records' notes
  const refPairs = new Set();
  [...people.map(p => [p.id, p.notes]), ...accounts.map(a => [a.id, a.notes])].forEach(([id, text]) => {
    findNames(text).forEach(other => {
      if (other === id || ownerId.get(id) === other) return;
      const k = [id, other].sort().join('|'); if (refPairs.has(k)) return; refPairs.add(k);
      addEdge({ type: 'shared', from: other, to: id, label: 'Named in notes', sub: '', why: `${nameOf(other)} is named in the notes on ${nameOf(id)}.` });
    });
  });

  // ---- Notes and questions: link to whatever they mention
  function mentions(text) {
    const out = new Map();
    findNames(text).forEach(id => out.set(id, 'names ' + nameOf(id)));
    const nt = norm(text);
    accounts.forEach(a => {
      const full = norm(a.number);
      const parts = String(a.number || '').split(/\s+/).map(norm).filter(x => x.length >= 6);
      if ((full.length >= 6 && nt.includes(full)) || parts.some(x => nt.includes(x))) out.set(a.id, 'quotes the account number');
    });
    let m; RE_LAST4.lastIndex = 0;
    while ((m = RE_LAST4.exec(String(text || '')))) {
      const hits = accounts.filter(a => digits(a.number).endsWith(m[1]));
      if (hits.length === 1 && !out.has(hits[0].id)) out.set(hits[0].id, `refers to the account ending ${m[1]}`);
    }
    extract(text).forEach(i => {
      const owners = identOwners(i.key);
      const targets = owners.length ? owners : [...(ident.get(i.key)?.src.keys() || [])];
      targets.forEach(id => { if (!out.has(id)) out.set(id, `quotes ${i.label}, which belongs to ${nameOf(id)}`); });
    });
    return out;
  }
  S.notes.forEach(n => {
    addNode(n.id, 'note', n);
    mentions(n.text).forEach((why, id) => addEdge({ type: 'mention', from: n.id, to: id, why: `This note ${why}.` }));
  });
  S.questions.forEach(q => {
    addNode(q.id, 'question', q);
    mentions(q.text + ' ' + (q.answer || '')).forEach((why, id) => addEdge({ type: 'mention', q: true, from: q.id, to: id, why: `This question ${why}.` }));
  });

  // ---- Money trail: follow payments forward in date order from each victim
  const victims = people.filter(p => p.role === 'victim');
  const reachedBy = new Map();
  const trails = new Map();
  victims.forEach(v => {
    const starts = accounts.filter(a => ownerId.get(a.id) === v.id).map(a => a.id);
    const arrive = new Map(starts.map(id => [id, '']));
    const prev = new Map();
    let changed = true, guard = 0;
    while (changed && guard++ < accounts.length + 2) {
      changed = false;
      for (const t of txs) {
        if (!arrive.has(t.from) || starts.includes(t.to)) continue;
        const at = arrive.get(t.from);
        if (t.date && at && t.date < at) continue;         // money can't leave before it arrived
        const when = t.date || at;
        const cur = arrive.get(t.to);
        if (!arrive.has(t.to) || (when && cur && when < cur)) { arrive.set(t.to, when); prev.set(t.to, t); changed = true; }
      }
    }
    const reached = [...arrive.keys()].filter(id => !starts.includes(id));
    reached.forEach(id => { if (!reachedBy.has(id)) reachedBy.set(id, new Set()); reachedBy.get(id).add(v.id); });
    const pathTo = id => { const ids = [], es = []; let cur = id, g = 0; while (prev.has(cur) && g++ < 50) { const t = prev.get(cur); ids.unshift(cur); es.unshift(edgeOfTx.get(t.id).id); cur = t.from; } ids.unshift(cur); return { ids, es }; };
    trails.set(v.id, { starts, reached, pathTo });
    if (!reached.length) return;
    const allE = new Set(), allN = new Set([v.id, ...starts]);
    reached.forEach(id => { const p = pathTo(id); p.ids.forEach(x => allN.add(x)); p.es.forEach(x => allE.add(x)); });
    const suspectAccs = reached.filter(id => personById.get(ownerId.get(id))?.role === 'suspect');
    const ends = reached.filter(id => !txs.some(t => t.from === id));
    const longest = reached.map(pathTo).sort((a, b) => b.ids.length - a.ids.length)[0];
    const suspectNames = [...new Set(suspectAccs.map(id => nameOf(ownerId.get(id))))];
    reached.forEach(id => { const o = ownerId.get(id); if (o) allN.add(o); });
    findings.push({
      sev: suspectNames.length ? 'high' : 'med', kind: 'Money trail',
      title: `${v.name}: money traced through ${reached.length} account${reached.length > 1 ? 's' : ''}`,
      text: (suspectNames.length ? `Reaches accounts held by <b>${suspectNames.map(esc).join('</b>, <b>')}</b>. ` : '') +
        `Longest route: ${longest.ids.map(id => esc(ownerId.get(id) && personById.get(ownerId.get(id)).role !== 'victim' ? nameOf(ownerId.get(id)) : nameOf(id))).join(' → ')}.` +
        (ends.length ? ` Last known stop: <b>${ends.map(id => esc(accLabel(accById.get(id)))).join('</b>, <b>')}</b>.` : ''),
      nodes: [...allN], edges: [...allE]
    });
  });

  // ---- Where victims' money meets
  const moneyIn = id => txs.filter(t => t.to === id).map(t => t.from);
  reachedBy.forEach((vs, id) => {
    if (vs.size < 2) return;
    // report only where the money first meets, not every stop after it
    if (moneyIn(id).some(src => { const s2 = reachedBy.get(src); return s2 && [...vs].every(v => s2.has(v)); })) return;
    const allE = new Set(), allN = new Set([id, ...vs]);
    vs.forEach(v => { const p = trails.get(v).pathTo(id); p.ids.forEach(x => allN.add(x)); p.es.forEach(x => allE.add(x)); });
    const holder = ownerId.get(id); if (holder) allN.add(holder);
    findings.unshift({
      sev: 'high', kind: 'Common destination',
      title: `Money from ${vs.size} victims ends up in ${accLabel(accById.get(id))}`,
      text: `${[...vs].map(v => '<b>' + esc(nameOf(v)) + '</b>').join(', ')} all have money that reaches this account` +
        (holder ? `, held by <b>${esc(nameOf(holder))}</b>` : ', whose holder is not identified') + `. It received <span class="mono">${money(inflow.get(id) || 0)}</span> in total.`,
      nodes: [...allN], edges: [...allE]
    });
  });

  // ---- Rapid pass-through (money in, most of it out again within 3 days)
  accounts.forEach(a => {
    if (personById.get(ownerId.get(a.id))?.role === 'victim') return;
    const ins = txs.filter(t => t.to === a.id && t.date), outs = txs.filter(t => t.from === a.id && t.date);
    for (const i of ins) {
      const o = outs.find(o => o.date >= i.date && dayDiff(i.date, o.date) <= 3 && o.amount >= i.amount * 0.7);
      if (!o) continue;
      const d = dayDiff(i.date, o.date);
      findings.push({ sev: 'med', kind: 'Pass-through',
        title: `${ownerId.get(a.id) ? nameOf(ownerId.get(a.id)) : accLabel(a)} moved money on within ${d === 0 ? 'the same day' : d === 1 ? '1 day' : d + ' days'}`,
        text: `Received <span class="mono">${money(i.amount)}</span> on ${fmtDate(i.date)} and sent <span class="mono">${money(o.amount)}</span> (${Math.round(o.amount / i.amount * 100)}%) on ${fmtDate(o.date)}. Quick in-and-out movement is a common layering sign.`,
        nodes: [a.id, i.from, o.to, ownerId.get(a.id)].filter(Boolean), edges: [edgeOfTx.get(i.id).id, edgeOfTx.get(o.id).id] });
      break;
    }
  });

  // ---- Escalating payments from one victim to the same place
  pairs.forEach(list => {
    const v = personById.get(ownerId.get(list[0].from));
    if (!v || v.role !== 'victim' || list.length < 2) return;
    const rising = list.every((t, i) => !i || t.amount > list[i - 1].amount);
    if (!rising) return;
    const to = list[0].to;
    findings.push({ sev: 'med', kind: 'Pattern',
      title: `${v.name}'s payments grew each time`,
      text: `${list.length} payments to ${esc(ownerId.get(to) ? nameOf(ownerId.get(to)) : accLabel(accById.get(to)))}, rising from <span class="mono">${money(list[0].amount)}</span> to <span class="mono">${money(list[list.length - 1].amount)}</span>. Rising payments are typical of investment scams.`,
      nodes: [v.id, list[0].from, to], edges: [edgeOfTx.get(list[0].id).id] });
  });

  // ---- Gaps worth asking about
  const have = new Set(S.questions.map(q => normName(q.text)));
  const suggest = (text, nodesArr) => { if (!have.has(normName(text))) suggested.push({ text, nodes: nodesArr }); };
  accounts.forEach(a => {
    const inn = inflow.get(a.id) || 0, out = outflow.get(a.id) || 0;
    if (!ownerId.get(a.id) && inn > 0) {
      findings.push({ sev: 'med', kind: 'Unknown holder', title: `No holder recorded for ${accLabel(a)}`,
        text: `It received <span class="mono">${money(inn)}</span>${a.holder ? `. The holder is given as “${esc(a.holder)}”, who is not in the case yet` : ''}.`, nodes: [a.id], edges: [] });
      { const inst = a.institution || '', word = a.type === 'crypto' ? 'wallet' : 'account'; suggest(`Who controls the ${inst}${inst.toLowerCase().includes(word) ? '' : (inst ? ' ' : '') + word} ${a.number || accLabel(a)}?`, [a.id]); }
    }
    if (inn > 0 && out === 0 && roleOfAcc(a.id) !== 'victim') suggest(`Where did the ${money(inn)} received by ${ownerId.get(a.id) ? nameOf(ownerId.get(a.id)) + "'s account" : accLabel(a)} go next?`, [a.id]);
  });
  people.forEach(p => {
    const accs = accounts.filter(a => ownerId.get(a.id) === p.id);
    if (p.role === 'suspect' && !accs.length) suggest(`Which accounts does ${p.name} control?`, [p.id]);
    if (p.role === 'other' && accs.some(a => reachedBy.has(a.id))) suggest(`Did ${p.name} know where the money in their account came from?`, [p.id]);
    if (p.role === 'victim' && !lossBy.get(p.id)) suggest(`Has ${p.name} made payments that are not recorded here yet?`, [p.id]);
  });

  const order = { high: 0, med: 1, info: 2 };
  findings.sort((a, b) => order[a.sev] - order[b.sev]);
  findings.forEach((f, i) => f.id = 'f' + i);
  const reachedByCount = new Map([...reachedBy].map(([k, v]) => [k, v.size]));
  return { nodes, nodeMap, edges, findings, suggested, ownerId, reachedByCount, inflow, outflow, lossBy, totalLoss, personById, accById, nameOf };
}

/* =====================================================================
   Map: layout + rendering
   Columns follow the money left to right. Each holder sits directly
   above the accounts they hold, so ownership reads without long lines.
   ===================================================================== */
const COL_W = 330, GROUP_GAP = 30, IN_GAP = 10, NODE_W = 210;
let A = null;                     // latest analysis
let geo = new Map();              // id -> {x,y,w,h}
let view = { x: 40, y: 80, z: 1 };
let layers = { money: true, owns: true, shared: true, mention: true };
let selected = null, focusFinding = null;
let fitPending = true;

function nodeHTML(n) {
  const r = n.ref;
  const qCount = A.edges.filter(e => e.type === 'mention' && e.q && e.to === n.id).length;
  const nCount = A.edges.filter(e => e.type === 'mention' && !e.q && e.to === n.id).length;
  const flags = (qCount ? `<span class="flag q" title="${qCount} question(s) mention this">? ${qCount}</span>` : '') +
                (nCount ? `<span class="flag n" title="${nCount} note(s) mention this">✎ ${nCount}</span>` : '');
  if (n.kind === 'note') return `<div class="node k-note" data-id="${n.id}"><div class="node-top"><span class="tag">Note${r.date ? ' · ' + fmtDate(r.date) : ''}</span></div><div class="node-body"><div class="node-title">${esc(r.text)}</div></div></div>`;
  if (n.kind === 'question') return `<div class="node k-question ${r.status === 'answered' ? 'answered' : ''}" data-id="${n.id}"><div class="node-top"><span class="tag">${r.status === 'answered' ? 'Answered' : 'Open question'}</span></div><div class="node-body"><div class="node-title">${esc(r.text)}</div>${r.status === 'answered' && r.answer ? `<div class="node-sub">${esc(r.answer)}</div>` : ''}</div></div>`;
  if (n.kind === 'account') {
    const inn = A.inflow.get(n.id) || 0, out = A.outflow.get(n.id) || 0;
    const holder = A.ownerId.get(n.id);
    const multi = (A.reachedByCount?.get(n.id) || 0) >= 2;
    return `<div class="node k-account ${holder ? '' : 'unknown'}" data-id="${n.id}">
      <div class="node-top"><span class="tag">${esc(ACC_TYPE[r.type] || 'Account')}</span><span class="node-flags">${multi ? '<span class="flag hot" title="Money from more than one victim reaches this account">Shared</span>' : ''}${flags}</span></div>
      <div class="node-body"><div class="node-title">${esc(r.institution || 'Unnamed institution')}</div><div class="node-num mono">${esc(r.number || 'No number')}</div>
      ${holder ? '' : `<div class="node-sub">${r.holder ? 'Holder: ' + esc(r.holder) + ' (not in case)' : 'Holder not identified'}</div>`}</div>
      ${inn || out ? `<div class="node-foot"><span>In <span class="in">${money(inn, true)}</span></span><span>Out <span class="out">${money(out, true)}</span></span></div>` : ''}
    </div>`;
  }
  const loss = A.lossBy.get(n.id);
  const sub = [r.aliases ? 'aka ' + r.aliases : '', r.phone, r.email].filter(Boolean).join(' · ');
  return `<div class="node k-${n.kind}" data-id="${n.id}">
    <div class="node-top"><span class="tag">${ROLE[n.kind] || 'Person'}</span><span class="node-flags">${flags}</span></div>
    <div class="node-body"><div class="node-title">${esc(r.name || 'Unnamed')}</div>${sub ? `<div class="node-sub">${esc(sub)}</div>` : ''}</div>
    ${n.kind === 'victim' ? `<div class="node-foot"><span>Reported loss</span><span class="out">${loss ? money(loss) : '—'}</span></div>` : ''}
  </div>`;
}

function computeLayout() {
  const S = state, own = A.ownerId;
  const people = S.people, accs = S.accounts;
  // money depth of each account (longest path from any victim account)
  const depth = new Map();
  accs.forEach(a => { if (A.personById.get(own.get(a.id))?.role === 'victim') depth.set(a.id, 0); });
  const money = A.edges.filter(e => e.type === 'money');
  for (let i = 0; i < accs.length + 1; i++) {
    let ch = false;
    money.forEach(e => {
      if (!depth.has(e.from)) return;
      const d = Math.min(depth.get(e.from) + 1, accs.length);
      if ((depth.get(e.to) ?? -1) < d && A.personById.get(own.get(e.to))?.role !== 'victim') { depth.set(e.to, d); ch = true; }
    });
    if (!ch) break;
  }
  // unreached accounts: place after whatever sends to them, else at step 1
  accs.forEach(a => { if (!depth.has(a.id)) { const ins = money.filter(e => e.to === a.id && depth.has(e.from)); depth.set(a.id, ins.length ? Math.max(...ins.map(e => depth.get(e.from))) + 1 : 1); } });

  // groups = holder + their accounts
  const groups = [];
  const inGroup = new Set();
  people.forEach(p => {
    const mine = accs.filter(a => own.get(a.id) === p.id);
    let col;
    if (p.role === 'victim') col = 0;
    else if (mine.length) col = Math.max(1, Math.min(...mine.map(a => depth.get(a.id))));
    else col = null;
    groups.push({ ids: [p.id, ...mine.map(a => a.id)], col, lead: p.id });
    mine.forEach(a => inGroup.add(a.id));
  });
  accs.forEach(a => { if (!inGroup.has(a.id)) groups.push({ ids: [a.id], col: Math.max(1, depth.get(a.id)), lead: a.id }); });
  const colOf = new Map();
  groups.forEach(g => { if (g.col != null) g.ids.forEach(id => colOf.set(id, g.col)); });
  const maxCol = Math.max(0, ...groups.map(g => g.col ?? 0));
  groups.filter(g => g.col == null).forEach(g => {
    const linked = A.edges.filter(e => e.type !== 'mention' && (e.from === g.lead || e.to === g.lead)).map(e => e.from === g.lead ? e.to : e.from).filter(id => colOf.has(id)).map(id => colOf.get(id));
    g.col = linked.length ? Math.max(1, Math.round(linked.reduce((a, b) => a + b, 0) / linked.length)) : maxCol + 1;
    g.col = Math.min(g.col, maxCol + 1);
    g.ids.forEach(id => colOf.set(id, g.col));
  });

  const cols = [];
  groups.forEach(g => { (cols[g.col] = cols[g.col] || []).push(g); });
  const h = id => geo.get(id)?.h || 90;
  const gH = g => g.ids.reduce((s, id) => s + h(id), 0) + IN_GAP * (g.ids.length - 1);
  const pos = new Map();
  const place = () => {
    cols.forEach((list, c) => {
      if (!list) return;
      const total = list.reduce((s, g) => s + gH(g), 0) + GROUP_GAP * (list.length - 1);
      let y = -total / 2;
      list.forEach(g => { g.ids.forEach(id => { pos.set(id, { x: c * COL_W, y }); y += h(id) + IN_GAP; }); y += GROUP_GAP - IN_GAP; });
    });
  };
  // order: first by earliest money date, then barycentre sweeps to reduce crossings
  const firstDate = g => { const ds = S.transactions.filter(t => g.ids.includes(t.to) || g.ids.includes(t.from)).map(t => t.date).filter(Boolean).sort(); return ds[0] || '9999'; };
  cols.forEach((list, c) => { if (list && c > 0) list.sort((a, b) => firstDate(a).localeCompare(firstDate(b))); });
  place();
  const nb = new Map();
  A.edges.filter(e => e.type !== 'mention').forEach(e => { [[e.from, e.to], [e.to, e.from]].forEach(([a, b]) => { if (!nb.has(a)) nb.set(a, []); nb.get(a).push(b); }); });
  const bary = (g, dir) => {
    const ys = [];
    g.ids.forEach(id => (nb.get(id) || []).forEach(o => { const oc = colOf.get(o); if (oc != null && (dir > 0 ? oc < g.col : oc > g.col) && pos.has(o)) ys.push(pos.get(o).y + h(o) / 2); }));
    return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : null;
  };
  for (let pass = 0; pass < 6; pass++) {
    const dir = pass % 2 ? -1 : 1;
    const idx = [...cols.keys()]; if (dir < 0) idx.reverse();
    idx.forEach(c => {
      const list = cols[c]; if (!list || list.length < 2) return;
      const cur = new Map(list.map((g, i) => [g, pos.get(g.ids[0]).y]));
      list.forEach(g => { g._b = bary(g, dir); if (g._b == null) g._b = cur.get(g); });
      list.sort((a, b) => a._b - b._b);
      place();
    });
  }
  // column headers
  const heads = [];
  cols.forEach((list, c) => {
    if (!list) return;
    const top = Math.min(...list.flatMap(g => g.ids.map(id => pos.get(id).y)));
    heads.push({ x: c * COL_W, y: top - 30, text: c === 0 ? 'Victims' : `Step ${c} · where the money went` });
  });
  // notes & questions lane underneath
  let bottom = Math.max(0, ...[...pos].map(([id, p]) => p.y + h(id)));
  const laneY = bottom + 120;
  const lanes = [];
  const rows = [[['note', 'question'], 'Notes, observations & questions']];
  let y = laneY;
  rows.forEach(([kinds, title]) => {
    const items = A.nodes.filter(n => kinds.includes(n.kind));
    if (!items.length) return;
    lanes.push({ y: y - 30, text: title });
    const want = items.map(n => {
      const xs = A.edges.filter(e => e.from === n.id).map(e => pos.get(e.to)?.x).filter(v => v != null);
      return { n, x: xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 1e9 };
    }).sort((a, b) => a.x - b.x);
    let prevX = -Infinity, rowH = 0;
    want.forEach(w => { const x = Math.max(w.x === 1e9 ? prevX + 250 : w.x, prevX + 250, 0); pos.set(w.n.id, { x, y }); prevX = x; rowH = Math.max(rowH, h(w.n.id)); });
    y += rowH + 80;
  });
  return { pos, heads, lanes, colCount: cols.length };
}

function renderMap() {
  const nodesEl = $('#nodes');

function anchor(g, side) {
  switch (side) {
    case 'r': return [g.x + g.w, g.y + g.h / 2];
    case 'l': return [g.x, g.y + g.h / 2];
    case 't': return [g.x + g.w / 2, g.y];
    default: return [g.x + g.w / 2, g.y + g.h];
  }
}
function edgePath(e) {
  const a = geo.get(e.from), b = geo.get(e.to);
  if (!a || !b) return null;
  let p0, p1, p2, p3;
  const acx = a.x + a.w / 2, bcx = b.x + b.w / 2, acy = a.y + a.h / 2, bcy = b.y + b.h / 2;
  if (Math.abs(acx - bcx) < 40 && e.type === 'owns') {           // same column: bracket on the left
    p0 = anchor(a, 'l'); p3 = anchor(b, 'l');
    const k = Math.min(60, 18 + Math.abs(p3[1] - p0[1]) * 0.12);
    p1 = [p0[0] - k, p0[1]]; p2 = [p3[0] - k, p3[1]];
  } else if (Math.abs(bcy - acy) > Math.abs(bcx - acx) * 0.9 && e.type !== 'money') { // mostly vertical
    const down = bcy > acy;
    p0 = anchor(a, down ? 'b' : 't'); p3 = anchor(b, down ? 't' : 'b');
    const k = Math.max(40, Math.abs(p3[1] - p0[1]) * 0.45) * (down ? 1 : -1);
    p1 = [p0[0], p0[1] + k]; p2 = [p3[0], p3[1] - k];
  } else if (b.x >= a.x + a.w - 10) {
    p0 = anchor(a, 'r'); p3 = anchor(b, 'l');
    const k = Math.max(50, (p3[0] - p0[0]) * 0.45);
    p1 = [p0[0] + k, p0[1]]; p2 = [p3[0] - k, p3[1]];
  } else if (a.x >= b.x + b.w - 10) {
    if (e.type === 'money') {                                    // money going backwards: loop round
      p0 = anchor(a, 'r'); p3 = anchor(b, 'l');
      p1 = [p0[0] + 120, p0[1] + 80]; p2 = [p3[0] - 120, p3[1] + 80];
    } else {
      p0 = anchor(a, 'l'); p3 = anchor(b, 'r');
      const k = Math.max(50, (p0[0] - p3[0]) * 0.45);
      p1 = [p0[0] - k, p0[1]]; p2 = [p3[0] + k, p3[1]];
    }
  } else {
    p0 = anchor(a, 'r'); p3 = anchor(b, 'r');
    p1 = [p0[0] + 70, p0[1]]; p2 = [p3[0] + 70, p3[1]];
  }
  const at = t => { const u = 1 - t; return [u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]]; };
  let mid = at(0.5);
  if (e.type === 'money' && p3[0] - p0[0] > COL_W) {   // long flow: put the label in the gap just before the receiving account
    const tx = p3[0] - (COL_W - NODE_W) / 2; let lo = 0.5, hi = 1;
    for (let i = 0; i < 20; i++) { const m = (lo + hi) / 2; if (at(m)[0] < tx) lo = m; else hi = m; }
    mid = at(lo);
  }
  return { d: `M${p0[0]},${p0[1]} C${p1[0]},${p1[1]} ${p2[0]},${p2[1]} ${p3[0]},${p3[1]}`, mid };
}

function drawEdges() {
  let minX = 0, minY = 0, maxX = 0, maxY = 0;
  geo.forEach(g => { minX = Math.min(minX, g.x); minY = Math.min(minY, g.y); maxX = Math.max(maxX, g.x + g.w); maxY = Math.max(maxY, g.y + g.h); });
  const svg = $('#edges');
  const pad = 400;
  svg.setAttribute('width', maxX - minX + pad * 2); svg.setAttribute('height', maxY - minY + pad * 2);
  svg.style.left = (minX - pad) + 'px'; svg.style.top = (minY - pad) + 'px';
  svg.setAttribute('viewBox', `${minX - pad} ${minY - pad} ${maxX - minX + pad * 2} ${maxY - minY + pad * 2}`);
  let paths = '', labels = [];
  A.edges.forEach(e => {
    if (!layers[e.type]) return;
    const p = edgePath(e); if (!p) return;
    e._mid = p.mid;
    const cls = `edge ${e.type}${e.q ? ' q' : ''}`;
    paths += `<path class="${cls}" data-e="${e.id}" d="${p.d}"${e.type === 'money' ? ' marker-end="url(#arrow)"' : ''}/><path class="edge-hit" data-e="${e.id}" d="${p.d}"><title>${esc(e.why)}</title></path>`;
    if (e.type === 'money') labels.push({ e, x: p.mid[0], y: p.mid[1], html: `${esc(e.label)}<small>${esc(e.sub)}</small>`, cls: 'money', h: 34 });
    else if (e.type === 'shared' && e.label) labels.push({ e, x: p.mid[0], y: p.mid[1], html: esc(e.label), cls: 'shared', h: 22 });
  });
  svg.innerHTML = paths;
  // nudge overlapping labels apart
  labels.sort((a, b) => a.y - b.y);
  for (let i = 0; i < labels.length; i++) for (let j = 0; j < i; j++) {
    const a = labels[j], b = labels[i];
    if (Math.abs(a.x - b.x) < 120 && b.y - a.y < (a.h + b.h) / 2 + 4) b.y = a.y + (a.h + b.h) / 2 + 4;
  }
  $('#elabels').innerHTML = labels.map(l => `<div class="elabel ${l.cls}" data-e="${l.e.id}" style="left:${l.x}px;top:${l.y}px">${l.html}</div>`).join('');
}

function highlightSet() {
  if (focusFinding) { const f = A.findings.find(x => x.id === focusFinding); if (f) return { n: new Set(f.nodes), e: new Set(f.edges) }; }
  if (selected && A.nodeMap.has(selected)) {
    const n = new Set([selected]), e = new Set();
    A.edges.forEach(x => { if (x.from === selected || x.to === selected) { e.add(x.id); n.add(x.from); n.add(x.to); } });
    // show the holder's accounts with the holder
    A.edges.filter(x => x.type === 'owns' && x.from === selected).forEach(x => A.edges.forEach(y => { if (y.type === 'money' && (y.from === x.to || y.to === x.to)) { e.add(y.id); n.add(y.from); n.add(y.to); } }));
    return { n, e };
  }
  return null;
}
function applyHighlight() {
  const hs = highlightSet();
  $('#world').classList.toggle('dim', !!hs);
  $$('#nodes .node').forEach(el => { el.classList.toggle('hl', !!hs && hs.n.has(el.dataset.id)); el.classList.toggle('sel', el.dataset.id === selected); });
  $$('#edges .edge, #elabels .elabel').forEach(el => el.classList.toggle('hl', !!hs && hs.e.has(el.dataset.e)));
}

/* ---------- pan / zoom / drag ---------- */
const vp = $('#viewport'), world = $('#world');
function applyView() { world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`; vp.style.backgroundPosition = `${view.x}px ${view.y}px`; vp.style.backgroundSize = `${24 * view.z}px ${24 * view.z}px`; }
function zoomAt(f, cx, cy) {
  const z = Math.min(2.2, Math.max(0.2, view.z * f));
  view.x = cx - (cx - view.x) * (z / view.z); view.y = cy - (cy - view.y) * (z / view.z); view.z = z; applyView();
}
function fit() {
  if (!geo.size) { view = { x: 40, y: 80, z: 1 }; applyView(); return; }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  geo.forEach(g => { minX = Math.min(minX, g.x); minY = Math.min(minY, g.y - 34); maxX = Math.max(maxX, g.x + g.w); maxY = Math.max(maxY, g.y + g.h); });
  const r = vp.getBoundingClientRect();
  const top = 64, pad = 28, avW = r.width - pad * 2, avH = r.height - top - pad - 44;
  const minZ = r.width < 700 ? 0.55 : 0.62;
  const z = Math.min(1.1, Math.min(avW / (maxX - minX), avH / (maxY - minY)));
  if (z >= minZ) { view.z = z; view.x = pad + (avW - (maxX - minX) * z) / 2 - minX * z; view.y = top + (avH - (maxY - minY) * z) / 2 - minY * z; }
  else {                      // too big to read at once: stay readable and start from the victims
    view.z = minZ; view.x = pad - minX * minZ;
    const fitH = (maxY - minY) * minZ; view.y = fitH < avH ? top + (avH - fitH) / 2 - minY * minZ : top - minY * minZ;
  }
  applyView();
}
const ptrs = new Map();
let drag = null, lastTap = {};
vp.addEventListener('pointerdown', ev => {
  if (ev.button !== 0 && ev.pointerType === 'mouse') return;
  ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  vp.setPointerCapture(ev.pointerId);
  if (ptrs.size === 2) { const [p, q] = [...ptrs.values()]; drag = { type: 'pinch', d: Math.hypot(p.x - q.x, p.y - q.y), z: view.z }; return; }
  const nodeEl = ev.target.closest('.node');
  const edgeEl = ev.target.closest('[data-e]');
  if (nodeEl) { const g = geo.get(nodeEl.dataset.id); drag = { type: 'node', id: nodeEl.dataset.id, el: nodeEl, sx: ev.clientX, sy: ev.clientY, ox: g.x, oy: g.y, moved: false }; }
  else drag = { type: 'pan', sx: ev.clientX, sy: ev.clientY, ox: view.x, oy: view.y, moved: false, edge: edgeEl?.dataset.e };
});
vp.addEventListener('pointermove', ev => {
  if (!ptrs.has(ev.pointerId) || !drag) return;
  ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (drag.type === 'pinch' && ptrs.size === 2) {
    const [p, q] = [...ptrs.values()]; const r = vp.getBoundingClientRect();
    zoomAt(drag.z * Math.hypot(p.x - q.x, p.y - q.y) / drag.d / view.z, (p.x + q.x) / 2 - r.left, (p.y + q.y) / 2 - r.top); return;
  }
  const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) < 5) return;
  drag.moved = true;
  if (drag.type === 'pan') { vp.classList.add('panning'); view.x = drag.ox + dx; view.y = drag.oy + dy; applyView(); }
  else if (drag.type === 'node') {
    const g = geo.get(drag.id); g.x = drag.ox + dx / view.z; g.y = drag.oy + dy / view.z;
    drag.el.style.left = g.x + 'px'; drag.el.style.top = g.y + 'px'; drawEdges(); applyHighlight();
  }
});
function endPtr(ev) {
  ptrs.delete(ev.pointerId);
  if (!drag) return;
  if (drag.type === 'pinch') { if (!ptrs.size) drag = null; return; }
  vp.classList.remove('panning');
  if (drag.type === 'node') {
    if (drag.moved) { const g = geo.get(drag.id); state.pos[drag.id] = { x: Math.round(g.x), y: Math.round(g.y) }; save(); }
    else {
      const now = Date.now();
      if (lastTap.id === drag.id && now - lastTap.t < 380) { lastTap = {}; openEditorFor(drag.id); }
      else { lastTap = { id: drag.id, t: now }; selectNode(drag.id); }
    }
  } else if (!drag.moved) {
    if (drag.edge) { const e = A.edges.find(x => x.id === drag.edge); if (e) { selected = null; focusFinding = null; showEdge(e); } }
    else { selected = null; focusFinding = null; applyHighlight(); renderRight(); }
  }
  drag = null;
}
vp.addEventListener('pointerup', endPtr);
vp.addEventListener('pointercancel', endPtr);
vp.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = vp.getBoundingClientRect();
  if (ev.ctrlKey || ev.deltaMode === 1 || Math.abs(ev.deltaY) >= 50 && ev.deltaX === 0) zoomAt(Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0022)), ev.clientX - r.left, ev.clientY - r.top);
  else { view.x -= ev.deltaX; view.y -= ev.deltaY; applyView(); }
}, { passive: false });

function selectNode(id, opts = {}) {
  selected = id; focusFinding = null; edgeDetail = null;
  const t = state.transactions.find(x => x.id === id);
  if (t) { const e = A.edges.find(x => x.type === 'money' && x.txs.some(y => y.id === id)); if (e) { selected = null; focusFinding = null; highlightEdge(e); } }
  rightTab = 'detail';
  applyHighlight(); renderRight(); renderLeft();
  if (opts.center) centerOn(t ? [t.from, t.to] : [id]);
  if (window.matchMedia('(max-width:920px)').matches && opts.fromList) { closeDrawers(); }
}
function highlightEdge(e) {
  edgeDetail = e;
  $('#world').classList.add('dim');
  $$('#nodes .node').forEach(el => el.classList.toggle('hl', el.dataset.id === e.from || el.dataset.id === e.to));
  $$('#edges .edge, #elabels .elabel').forEach(el => el.classList.toggle('hl', el.dataset.e === e.id));
}
function showEdge(e) { rightTab = 'detail'; selected = null; highlightEdge(e); renderRight(); }
function centerOn(ids) {
  const gs = ids.map(id => geo.get(id)).filter(Boolean); if (!gs.length || mainView !== 'map') return;
  const cx = gs.reduce((s, g) => s + g.x + g.w / 2, 0) / gs.length, cy = gs.reduce((s, g) => s + g.y + g.h / 2, 0) / gs.length;
  const r = vp.getBoundingClientRect();
  view.x = r.width / 2 - cx * view.z; view.y = r.height / 2 - cy * view.z; applyView();
}

function renderTimeline() {
  const items = [
    ...state.transactions.map(t => ({ date: t.date, kind: 'tx', t })),
    ...state.notes.filter(n => n.date).map(n => ({ date: n.date, kind: 'note', n }))
  ].sort(byDate);
  let month = '', loss = 0, html = '';
  items.forEach(it => {
    const m = it.date ? it.date.slice(0, 7) : 'none';
    if (m !== month) { month = m; html += `<div class="tl-month">${m === 'none' ? 'No date' : MONTHS[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4)}</div>`; }
    if (it.kind === 'tx') {
      const t = it.t, fromOwner = A.personById.get(A.ownerId.get(t.from)), isLoss = fromOwner?.role === 'victim' && A.ownerId.get(t.to) !== fromOwner.id;
      if (isLoss) loss += t.amount;
      html += `<div class="tl-item" data-row="${t.id}" style="cursor:pointer"><span class="tl-date">${it.date ? fmtDate(it.date) : '—'}</span><span class="tl-mark" style="--c:${isLoss ? 'var(--victim)' : 'var(--money)'}"></span>
        <span class="tl-what">${esc(accHolderName(t.from))} → ${esc(accHolderName(t.to))}<small>${esc([t.method, t.reference && 'Ref ' + t.reference, t.notes].filter(Boolean).join(' · '))}</small></span>
        <span class="tl-amt">${money(t.amount)}${isLoss ? `<small>Victim losses so far ${money(loss)}</small>` : ''}</span></div>`;
    } else {
      html += `<div class="tl-item" data-row="${it.n.id}" style="cursor:pointer"><span class="tl-date">${fmtDate(it.date)}</span><span class="tl-mark" style="--c:var(--note)"></span><span class="tl-what" style="font-weight:500">${esc(it.n.text)}</span><span></span></div>`;
    }
  });
  $('#tl-inner').innerHTML = html || '<p class="empty-row" style="text-align:center;padding:40px">Add transactions or dated notes to build the timeline.</p>';
}

function renderAll() {
  A = analyse();

  $('#case-ref').textContent = state.meta.ref || 'CASE';
  document.title = (state.meta.title ? state.meta.title + ' · ' : '') + 'Case Map';
