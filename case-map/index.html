    ${f('f-analyst', 'Analyst', state.meta.analyst, { ph: 'Your name' })}`,
    () => { Object.assign(state.meta, { title: val('f-title'), ref: val('f-ref2'), currency: $('#f-cur').value, analyst: val('f-analyst') }); });
}
function openEditorFor(id) {
  const p = state.people.find(x => x.id === id); if (p) return editPerson(p);
  const a = state.accounts.find(x => x.id === id); if (a) return editAccount(a);
  const t = state.transactions.find(x => x.id === id); if (t) return editTx(t);
  const n = state.notes.find(x => x.id === id); if (n) return editNote(n);
  const q = state.questions.find(x => x.id === id); if (q) return editQuestion(q);
}
function addByKind(k) {
  if (['victim', 'suspect', 'other'].includes(k)) editPerson(null, k);
  else if (k === 'account') editAccount(null);
  else if (k === 'transaction') editTx(null);
  else if (k === 'note') editNote(null);
  else if (k === 'question') editQuestion(null);
}
function addChooser() {
  openDialog('What do you want to add?', `<div class="choice" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${[['victim', 'Victim'], ['suspect', 'Alleged fraudster'], ['other', 'Other party'], ['account', 'Account or wallet'], ['transaction', 'Transaction'], ['note', 'Note'], ['question', 'Question'], ['paste', 'Paste many rows']].map(([k, l]) => `<button type="button" data-addk="${k}" style="padding:12px">${l}</button>`).join('')}</div>`, null, null);
}
$('#dlg-body').addEventListener('click', e => { const b = e.target.closest('[data-addk]'); if (!b) return; dlg.close(); const k = b.dataset.addk; setTimeout(() => k === 'paste' ? openPaste() : addByKind(k), 10); });

/* ---------- Paste many transactions ---------- */
const AI_PROMPT = `Convert the case notes below into one line per payment, using exactly this format and nothing else:
Date | From | To | Amount | Method or reference | Notes
- Date as YYYY-MM-DD
- From / To: the account holder's name followed by the bank and account number in brackets, e.g. Margaret Holloway (Barclays 43891022). Use "Unknown" for an unknown holder.
- Amount as a plain number, e.g. 18000
- No headings, no bullet points, no extra text.

Case notes:
`;
function parseSide(s) {
  s = s.trim(); if (!s) return null;
  const m = s.match(/^(.*?)\s*\((.*)\)\s*$/);
  let name = m ? m[1].trim() : s, acct = m ? m[2].trim() : '';
  if (!m && /\d{4,}/.test(s)) { acct = s; name = ''; }
  if (/^unknown$/i.test(name)) name = '';
  const numMatch = acct.match(/([A-Z]{2}\d{2}[A-Z0-9 ]{8,}|[a-z0-9]{20,}|[\d][\d\s-]{3,}\d)\s*$/i);
  const number = numMatch ? numMatch[1].trim() : '';
  const institution = number ? acct.slice(0, acct.length - numMatch[0].length).replace(/[#,:\s]+$/, '').trim() : acct;
  return { name, number, institution, raw: s };
}
function findAccount(side, pending) {
  const all = [...state.accounts, ...pending];
  if (side.number) { const n = norm(side.number); const hit = all.find(a => norm(a.number) === n || (n.length >= 6 && norm(a.number).endsWith(n))); if (hit) return hit; }
  if (side.name) {
    const p = state.people.find(p => [p.name, ...String(p.aliases || '').split(',')].some(x => normName(x) === normName(side.name)));
    const holderN = normName(p ? p.name : side.name);
    const mine = all.filter(a => normName(a.holder) === holderN && (!side.institution || normName(a.institution) === normName(side.institution)));
    if (mine.length === 1 && !side.number) return mine[0];
  }
  return null;
}
function parsePaste(text, commit) {
  const pending = [], rows = [];
  text.split(/\r?\n/).forEach(line => {
    if (!line.trim() || /^\s*date\s*[|\t,]/i.test(line)) return;
    const parts = (line.includes('|') ? line.split('|') : line.includes('\t') ? line.split('\t') : line.split(',')).map(x => x.trim());
    const [d, fromS, toS, amt, method = '', ...rest] = parts;
    const date = parseDate(d), amount = parseAmount(amt);
    const from = parseSide(fromS || ''), to = parseSide(toS || '');
    const r = { date, amount, from, to, method, notes: rest.join(' | '), ok: !!(from && to && amount), fromAcc: null, toAcc: null, fromNew: false, toNew: false };
    if (r.ok) ['from', 'to'].forEach(k => {
      let a = findAccount(r[k], pending);
      if (!a) {
        const pr = state.people.find(p => normName(p.name) === normName(r[k].name) || String(p.aliases || '').split(',').some(x => normName(x) === normName(r[k].name)));
        a = { id: uid('a'), holder: pr ? pr.name : r[k].name, institution: r[k].institution, number: r[k].number, type: /^(bc1|0x|[13][a-km-z])/i.test(r[k].number) && r[k].number.length > 24 ? 'crypto' : 'bank', notes: 'Added from pasted data.' };
        pending.push(a); r[k + 'New'] = true;
      }
      r[k + 'Acc'] = a;
    });
    rows.push(r);
  });
  if (commit) {
    state.accounts.push(...pending);
    const METHOD = /payment|transfer|chaps|bacs|faster|wire|sepa|swift|card|cash|cheque|check|crypto|zelle|paypal|gift/i;
    rows.filter(r => r.ok).forEach(r => {
      const isMethod = METHOD.test(r.method);
      state.transactions.push({ id: uid('t'), date: r.date, from: r.fromAcc.id, to: r.toAcc.id, amount: r.amount, method: isMethod ? r.method : '', reference: isMethod ? '' : r.method, notes: r.notes });
    });
    return rows.filter(r => r.ok).length;
  }
  return { rows, pending };
}
function openPaste() {
  openDialog('Paste transactions', `
    <p style="margin:4px 0 6px;font-size:12.5px;color:var(--ink-2)">One payment per line. Columns can be separated by <b>|</b>, tabs (straight from Excel) or commas:</p>
    <div class="mono" style="font-size:11.5px;padding:8px 10px;border-radius:8px;background:var(--sunken);overflow-x:auto;white-space:nowrap">Date | From | To | Amount | Method or reference | Notes</div>
    <p class="hint" style="font-size:11.5px;color:var(--muted);margin:6px 0 0">Write From and To as <span class="mono">Name (Bank 12345678)</span>. Existing accounts are matched by number; new ones are created for you.</p>
    <div class="field"><label for="f-paste">Rows</label><textarea class="input mono" id="f-paste" style="min-height:130px;font-size:12px;white-space:pre" placeholder="2026-03-02 | Margaret Holloway (Barclays 43891022) | Unknown (Wise 88112093) | 2500 | Faster Payment | Final 'release' fee"></textarea></div>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn small" type="button" id="copy-ai">Copy a prompt for ChatGPT / Claude</button><span class="hint" style="font-size:11px;color:var(--muted);align-self:center">Paste it with your case notes to get rows in this format.</span></div>
    <div class="paste-preview" id="paste-prev" hidden></div>`,
    () => { const n = parsePaste(val('f-paste'), true); if (!n) { toast('No complete rows to add yet'); return false; } toast(`Added ${n} transaction${n > 1 ? 's' : ''}`); }, null, 'Add to case');
  const upd = () => {
    const { rows } = parsePaste($('#f-paste').value, false);
    const box = $('#paste-prev'); box.hidden = !rows.length;
    box.innerHTML = `<table><thead><tr><th>Date</th><th>From</th><th>To</th><th>Amount</th><th>Status</th></tr></thead><tbody>${rows.map(r => `<tr><td class="mono">${r.date || '—'}</td><td>${esc(r.from?.raw || '—')}${r.fromNew ? ' <span class="status-pill status-open">new</span>' : ''}</td><td>${esc(r.to?.raw || '—')}${r.toNew ? ' <span class="status-pill status-open">new</span>' : ''}</td><td class="mono">${r.amount ? money(r.amount) : '—'}</td><td>${r.ok ? '<span class="status-pill status-answered">Ready</span>' : '<span class="status-pill" style="background:var(--fraud-soft);color:var(--fraud)">Incomplete</span>'}</td></tr>`).join('')}</tbody></table>`;
  };
  $('#f-paste').addEventListener('input', upd);
  $('#copy-ai').addEventListener('click', () => copyText(AI_PROMPT, 'Prompt copied'));
}
function copyText(text, msg) {
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); toast(ok ? msg : 'Copy was blocked by the browser'); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => toast(msg), fallback); else fallback();
}

/* =====================================================================
   Wiring
   ===================================================================== */
$('#case-title').addEventListener('change', e => { state.meta.title = e.target.value.trim(); save(); document.title = state.meta.title + ' · Case Map'; });
$('#data-list').addEventListener('click', e => {
  const add = e.target.closest('[data-add]'); if (add) return addByKind(add.dataset.add);
  const row = e.target.closest('[data-row]'); if (row) { if (mainView !== 'map') setView('map'); selectNode(row.dataset.row, { center: true, fromList: true }); }
});
$('#data-list').addEventListener('dblclick', e => { const row = e.target.closest('[data-row]'); if (row) openEditorFor(row.dataset.row); });
$('#panel-right').addEventListener('click', e => {
  const tab = e.target.closest('[data-rtab]'); if (tab) { rightTab = tab.dataset.rtab; renderRight(); return; }
  const fd = e.target.closest('[data-finding]');
  if (fd) {
    focusFinding = focusFinding === fd.dataset.finding ? null : fd.dataset.finding; selected = null; edgeDetail = null;
    if (mainView !== 'map') setView('map');
    applyHighlight(); renderRight();
    if (focusFinding) { const fnd = A.findings.find(x => x.id === focusFinding); centerOn(fnd.nodes); if (window.matchMedia('(max-width:920px)').matches) closeDrawers(); }
    return;
  }
  const ed = e.target.closest('[data-edit]'); if (ed) return openEditorFor(ed.dataset.edit);
  const go = e.target.closest('[data-goto]'); if (go) { if (mainView !== 'map') setView('map'); return selectNode(go.dataset.goto, { center: true }); }
  const rw = e.target.closest('[data-row]'); if (rw) return selectNode(rw.dataset.row, { center: true });
  const sg = e.target.closest('[data-suggest]');
  if (sg) { const s = A.suggested[+sg.dataset.suggest]; state.questions.push({ id: uid('q'), text: s.text, status: 'open', answer: '' }); save(); renderAll(); toast('Question added'); return; }
  if (e.target.id === 'q-add-btn') { const t = val('q-new'); if (!t) { toast('Write the question first'); return; } state.questions.push({ id: uid('q'), text: t, status: 'open', answer: '' }); save(); renderAll(); toast('Question added'); }
});
$('#tl-inner').addEventListener('click', e => { const r = e.target.closest('[data-row]'); if (r) { selected = r.dataset.row; edgeDetail = null; rightTab = 'detail'; renderRight(); renderLeft(); } });
$('#tl-inner').addEventListener('dblclick', e => { const r = e.target.closest('[data-row]'); if (r) openEditorFor(r.dataset.row); });

function setView(v) {
  mainView = v;
  $$('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $('#viewport').hidden = v !== 'map'; $('#timeline').hidden = v !== 'timeline';
  $('.map-right').hidden = v !== 'map'; $('.mapzoom').hidden = v !== 'map'; $('#legend').hidden = v !== 'map';
  if (v === 'map') renderMap(); else renderTimeline();
}
$$('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
$('#layers').addEventListener('click', e => {
  const b = e.target.closest('[data-layer]'); if (!b) return;
  layers[b.dataset.layer] = !layers[b.dataset.layer]; b.setAttribute('aria-pressed', layers[b.dataset.layer]);
  drawEdges(); applyHighlight();
});
$('#zoom-in').addEventListener('click', () => { const r = vp.getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); });
$('#zoom-out').addEventListener('click', () => { const r = vp.getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); });
$('#zoom-fit').addEventListener('click', fit);
$('#btn-focus').addEventListener('click', () => {
  const on = $('#app').classList.toggle('focus');
  $('#btn-focus span').textContent = on ? 'Show panels' : 'Focus map';
  requestAnimationFrame(fit);
});
$('#tidy').addEventListener('click', () => { state.pos = {}; save(); fitPending = true; renderMap(); toast('Layout tidied'); });

// Case menu
const menu = $('#case-menu');
$('#btn-case').addEventListener('click', e => {
  e.stopPropagation();
  if (!menu.hidden) { menu.hidden = true; return; }
  const r = e.currentTarget.getBoundingClientRect();
  menu.hidden = false; menu.style.top = (r.bottom + 6) + 'px'; menu.style.left = Math.max(8, Math.min(window.innerWidth - menu.offsetWidth - 8, r.right - menu.offsetWidth)) + 'px';
});
document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) menu.hidden = true; });
let pendingReset = null;
menu.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if ((act === 'new' || act === 'sample') && pendingReset !== act) {
    pendingReset = act; b.dataset.label = b.dataset.label || b.innerHTML;
    b.innerHTML = `<b style="color:var(--fraud)">Replace the current case? Click again</b>`;
    setTimeout(() => { if (pendingReset === act) { pendingReset = null; b.innerHTML = b.dataset.label; } }, 3500);
    return;
  }
  menu.hidden = true;
  if (b.dataset.label) { b.innerHTML = b.dataset.label; }
  pendingReset = null;
  if (act === 'export') {
    try {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = (state.meta.ref || 'case') + '.json'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Case file downloaded');
    } catch (_) { copyText(JSON.stringify(state), 'Download blocked here, so the case file was copied instead'); }
  }
  if (act === 'copy') copyText(JSON.stringify(state, null, 2), 'Case file copied');
  if (act === 'import') $('#file-in').click();
  if (act === 'paste') openPaste();
  if (act === 'settings') editSettings();
  if (act === 'sample') { state = exampleCase(); selected = focusFinding = null; fitPending = true; save(); renderAll(); toast('Example case loaded'); }
  if (act === 'new') { state = emptyCase(); selected = focusFinding = null; fitPending = true; save(); renderAll(); toast('New empty case started'); }
});
$('#file-in').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { try { state = sanitize(JSON.parse(rd.result)); selected = focusFinding = null; fitPending = true; save(); renderAll(); toast('Opened ' + file.name); } catch (_) { toast('That file is not a Case Map file'); } };
  rd.readAsText(file); e.target.value = '';
});
// Paste a case file anywhere (outside inputs) to open it
document.addEventListener('paste', e => {
  if (e.target.closest('input, textarea') || dlg.open) return;
  const t = e.clipboardData?.getData('text') || '';
  if (/^\s*\{[\s\S]*"transactions"/.test(t)) { try { state = sanitize(JSON.parse(t)); fitPending = true; save(); renderAll(); toast('Case file opened from clipboard'); } catch (_) {} }
});
$('#btn-paste').addEventListener('click', openPaste);
$('#m-add').addEventListener('click', addChooser);

// Theme
const THEME_KEY = 'case-map-theme';
function setTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try { setTheme(localStorage.getItem(THEME_KEY)); } catch (_) {}
$('#btn-theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = dark ? 'light' : 'dark'; setTheme(next); try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
});

// Mobile drawers
function closeDrawers() { $$('.panel').forEach(p => p.classList.remove('open')); $('#scrim').hidden = true; }
$$('[data-open-drawer]').forEach(b => b.addEventListener('click', () => { closeDrawers(); $('#' + b.dataset.openDrawer).classList.add('open'); $('#scrim').hidden = false; }));
$$('[data-close-drawer]').forEach(b => b.addEventListener('click', closeDrawers));
$('#scrim').addEventListener('click', closeDrawers);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !dlg.open) { selected = null; focusFinding = null; edgeDetail = null; applyHighlight(); renderRight(); renderLeft(); closeDrawers(); }
});
let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (mainView === 'map') fit(); }, 150); });

applyView();
renderAll();
if (document.fonts?.ready) document.fonts.ready.then(() => { if (mainView === 'map') { fitPending = true; renderMap(); } });
})();
</script>
</body>
